name: CI

# Every pull request, whatever its base (stacked PRs included), and every push
# to the two long-lived branches.
on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # `bun run verify` is the gate list (scripts/verify.mjs; `bun run verify
    # --list` prints it), so CI and a local run cannot drift. Should pass on a
    # fresh clone with no `.env` set — every optional feature (auth, billing,
    # media, Sentry) defaults to off, and tests mock the AWS / Stripe surfaces.
    name: Lint, Type Check, Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Postgres for the `@mrmeg/expo-analytics` database suites (`*.db.test.ts`),
    # which skip without ANALYTICS_TEST_DATABASE_URL. Each suite works in its own
    # throwaway schema; the harness refuses a non-loopback host or a database
    # name without "test".
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: analytics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d analytics_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      # Expo SDK 58 requires Node 22.13+, 24.3+, or 26; the runner default is not pinned.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # REQUIRE_TEST_DB=1 turns a missing database into a failure instead of a
      # skip. Only the analytics harness reads it, so it is safe for the whole run.
      - name: Verify
        env:
          ANALYTICS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/analytics_test
          REQUIRE_TEST_DB: "1"
        run: bun run verify

  bundle-size:
    # Builds the web export and compares the client JS total against the
    # checked-in baseline (`scripts/bundle-baseline.json`). Fails on
    # >10% growth. Runs in parallel with `validate` since neither needs
    # the other's output.
    name: Web Build + Bundle Size
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # Expo SDK 58 requires Node 22.13+, 24.3+, or 26; the runner default is not pinned.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # metro.config.js turns on tree shaking and graph optimization, so this measures
      # the same bundle every production build ships.
      - name: Build web export
        run: bun run build

      - name: Bundle size check
        run: bun run bundle-size

      - name: First-load budget
        run: bun run first-load
