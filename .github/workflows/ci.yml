name: CI

# Every pull request, whatever its base (stacked PRs included), and every push
# to the two long-lived branches.
on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # `bun run verify` is the gate list (scripts/verify.mjs; `bun run verify
    # --list` prints it), so CI and a local run cannot drift. Should pass on a
    # fresh clone with no `.env` set — every optional feature (auth, billing,
    # media, Sentry) defaults to off, and tests mock the AWS / Stripe surfaces.
    name: Lint, Type Check, Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Expo SDK 58 requires Node 22.13+, 24.3+, or 26; the runner default is not pinned.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify

  bundle-size:
    # Builds the web export and compares the client JS total against the
    # checked-in baseline (`scripts/bundle-baseline.json`). Fails on
    # >10% growth. Runs in parallel with `validate` since neither needs
    # the other's output.
    name: Web Build + Bundle Size
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Expo SDK 58 requires Node 22.13+, 24.3+, or 26; the runner default is not pinned.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web export
        # Match local builds: `.env` (gitignored) enables these flags, so the
        # baseline is measured tree-shaken and CI must be too.
        env:
          EXPO_UNSTABLE_TREE_SHAKING: "1"
          EXPO_UNSTABLE_METRO_OPTIMIZE_GRAPH: "1"
        run: bun run build

      - name: Bundle size check
        run: bun run bundle-size
