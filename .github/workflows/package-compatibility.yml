name: Package Compatibility

# Every pull request that touches a package or its compatibility tooling,
# whatever the PR's base (stacked PRs included), and the same pushes to the two
# long-lived branches. Keep the two path lists identical.
on:
  pull_request:
    paths:
      - "packages/media/**"
      - "packages/purchases/**"
      - "packages/ui/**"
      - "scripts/check-package-consumer-profile.mjs"
      - "scripts/check-package-peer-compatibility.mjs"
      - "scripts/package-compatibility-profiles.mjs"
      - "scripts/lib/workspacePackages.mjs"
      - ".github/workflows/package-compatibility.yml"
      - ".bun-version"
      - "package.json"
      - "bun.lock"
  push:
    branches: [main, dev]
    paths:
      - "packages/media/**"
      - "packages/purchases/**"
      - "packages/ui/**"
      - "scripts/check-package-consumer-profile.mjs"
      - "scripts/check-package-peer-compatibility.mjs"
      - "scripts/package-compatibility-profiles.mjs"
      - "scripts/lib/workspacePackages.mjs"
      - ".github/workflows/package-compatibility.yml"
      - ".bun-version"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

jobs:
  compatibility:
    name: ${{ matrix.package }} / Expo ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: media
            sdk: 55
          - package: media
            sdk: 56
          - package: media
            sdk: 57
          - package: media
            sdk: 58
          - package: purchases
            sdk: 57
          - package: purchases
            sdk: 58
          - package: ui
            sdk: 56
          - package: ui
            sdk: 57
          - package: ui
            sdk: 58

    steps:
      - uses: actions/checkout@v4

      # The fixture's `expo export` runs on Node, and Expo SDK 58 requires Node
      # 22.13+, 24.3+, or 26; the runner default is not pinned.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Check peer declarations
        run: bun run packages:peer-check

      - name: Test packed consumer
        run: >-
          bun run packages:compatibility --
          --package ${{ matrix.package }}
          --sdk ${{ matrix.sdk }}
