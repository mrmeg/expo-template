# Screen-template registry, end to end.
#
# The Explore template grid is driven by `SCREEN_TEMPLATES` from
# `client/templates/registry.generated` — generated by `bun run gen:templates`
# from each `client/templates/<id>/meta.ts`. Tapping a card and landing on the
# rendered template proves the generated registry, the `meta.route` value, and
# the `(demos)` stack screen all line up. A stale registry (a template folder
# added without regenerating, or a route renamed) fails here.
#
# "Pricing" is picked because its label is unique in the grid and its screen
# renders a distinctive heading. Explore previews only the four lowest-ordered
# templates (`EXPLORE_TEMPLATE_PREVIEW_COUNT`), and Pricing (order 40) is
# deliberately one of them, so the tap needs no gallery detour.
#
# The second pass covers the components gallery, which replaced the old
# "Component Library" featured card: Explore → Components → a component detail.
# `/(main)/(demos)/showcase` (the kitchen sink) is still reachable from that
# gallery's header and is asserted there.
#
# Two notes on selectors, both learned from real runs on iOS:
#
#   1. Card selectors are regexes. Each grid card is one Pressable whose
#      children collapse into a single accessibility string — the Pricing card
#      reads ", Pricing, Plans & comparison", not "Pricing" — and Maestro
#      matches a text selector against the whole string. A bare "Pricing"
#      matches nothing.
#   2. Each navigation gets its own `launchApp`, rather than pushing and popping
#      back. Maestro's `back` is an edge-swipe on iOS and does not reliably pop
#      a native stack, and the header back button is labelled "Explore" — the
#      same label as the Explore tab — so tapping it is ambiguous. Relaunching
#      is slower but deterministic.
appId: ${APP_ID}
env:
  APP_ID: com.mrmeg.template
---
# ── Screen template: Pricing (meta.label "Pricing", order 40) ───────────
- launchApp:
    clearState: true
- assertVisible:
    id: "onboarding-gate"
- tapOn:
    id: "onboarding-skip-button"
- assertVisible:
    id: "explore-screen"

- scrollUntilVisible:
    element: ".*Pricing, Plans & comparison.*"
    direction: DOWN
    centerElement: true
- tapOn: ".*Pricing, Plans & comparison.*"

# The template screen renders (title comes from client/templates/pricing/demo).
- assertVisible: "Choose your plan"
- assertVisible: "Monthly"
- assertNotVisible:
    id: "explore-screen"

# ── Components gallery → detail → kitchen sink ──────────────────────────
- launchApp:
    clearState: true
- assertVisible:
    id: "onboarding-gate"
- tapOn:
    id: "onboarding-skip-button"
- assertVisible:
    id: "explore-screen"

# The "Components" section head links to the gallery.
- tapOn:
    id: "explore-components-link"
- assertVisible:
    id: "components-gallery"
- assertNotVisible:
    id: "explore-screen"

# A card opens that component's detail screen, seeded from
# client/showcase/details.tsx (Button has variants + a usage snippet).
- tapOn:
    id: "component-card-Button"
- assertVisible:
    id: "component-detail"
- assertVisible: "Variants"
- assertVisible: "Import"
- assertVisible: "Usage"

# ── Kitchen sink still reachable from the gallery header ────────────────
- launchApp:
    clearState: true
- assertVisible:
    id: "onboarding-gate"
- tapOn:
    id: "onboarding-skip-button"
- tapOn:
    id: "explore-components-link"
- assertVisible:
    id: "components-gallery"

- tapOn:
    id: "components-kitchen-sink-link"
- assertVisible: "UI Components"
- assertVisible: "Accordion"
